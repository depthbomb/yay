version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/ui"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      bun-security:
        applies-to: "security-updates"
        patterns:
          - "*"

